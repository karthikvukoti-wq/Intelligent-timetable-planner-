<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tempo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FC475C"/>
      <stop offset="100%" stop-color="#FDB365"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#tempo-grad)"/>
  <!-- Clock Circle -->
  <circle cx="32" cy="32" r="18" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Clock Hands pointing to 9:00 / 10:15 -->
  <polyline points="32 20 32 32 40 32" stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>
</svg>
